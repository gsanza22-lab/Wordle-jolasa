<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle jolasa</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="container">
      
      <section id="container-config" class="konfigurazioa">
        <label for="saiakeraKopurua"> Intentos </label>

        <input type="number" id="saiakeraKopurua" min="1" max="10" value="6" />
        <!--input para recibir-->

        <label for="letraKopurua"> nº de letras </label>

        <input type="number" id="letraKopurua" min="3" max="8" value="5" />

        <button id="btn-jugar">Jugar</button>
      </section>

      <section id="container-juego" class="jokoa ezkutuan">
        <div id="taula" class="taula"></div>

        <div id="teklatua" class="teklatua"></div>
      </section>

      <section id="container-resultado" class="emaitza ezkutuan">
        <h2 id="emaitzaMezua"></h2>

        <p id="hitzarenEmaitza"></p>

        <h2>Ultimas 10 partidas</h2>

        <ul id="lista-historial"></ul>

        <button id="btn-reiniciar">Jugar de nuevo</button>
      </section>
    </main>

    <script src="js/code.js"></script>
  </body>
</html>
